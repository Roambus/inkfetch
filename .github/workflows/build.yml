name: Build & Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  check:
    name: 静态检查与单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: 构建 Android APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # 配置了签名 secrets 时使用正式签名，否则回退到 debug 签名（仍可直接安装）。
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/inkfetch-release.jks
            printf 'storeFile=inkfetch-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
            echo "已使用正式签名"
          else
            echo "未提供签名 secrets，使用 debug 签名"
          fi

      - name: Build APKs
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/InkFetch-android-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/InkFetch-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/InkFetch-android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/InkFetch-android-x86_64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  windows:
    name: 构建 Windows 桌面版
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "dist/InkFetch-windows-x64.zip" -Force

      # 单文件版：同一个 runner 二进制带 `--pack` 参数即变成打包器，
      # 把 Release 目录压进 exe 尾部；运行时不落地，退出即清理临时目录。
      - name: Build single-file EXE
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\build_single_exe.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/InkFetch-windows-x64.zip
            dist/InkFetch-*-windows-x64.exe
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: [android, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.apk *.zip *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: InkFetch ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
